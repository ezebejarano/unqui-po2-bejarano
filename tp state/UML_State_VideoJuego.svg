<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Diagrama de clases UML — TP State (Máquina de Video Juegos)</text>

  <!-- ===== Referencias / leyenda ===== -->
  <g font-size="12" fill="#333">
    <rect x="24" y="96" width="262" height="86" fill="#fafafa" stroke="#cccccc"/>
    <text x="36" y="116" font-weight="bold" font-size="12.5">Referencias</text>
    <polygon points="46,132 56,139 46,146 36,139" fill="#ffffff" stroke="#333" stroke-width="1.3"/>
    <line x1="56" y1="139" x2="84" y2="139" stroke="#333" stroke-width="1.3"/>
    <text x="92" y="143">agregación ("tiene un")</text>
    <polygon points="46,158 38,168 54,168" fill="#ffffff" stroke="#333" stroke-width="1.3"/>
    <line x1="46" y1="168" x2="84" y2="168" stroke="#333" stroke-width="1.3"/>
    <text x="92" y="172">herencia ("extends")</text>
  </g>

  <!-- ===== Context: MaquinaVideoJuego ===== -->
  <text x="771" y="86" font-size="12" font-style="italic" fill="#777">«Context»</text>
  <rect x="427" y="70" width="346" height="212" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <line x1="427" y1="102" x2="773" y2="102" stroke="#3367d6" stroke-width="1.5"/>
  <line x1="427" y1="136" x2="773" y2="136" stroke="#3367d6" stroke-width="1.5"/>
  <text x="600" y="93" text-anchor="middle" font-size="15" font-weight="bold">MaquinaVideoJuego</text>
  <text x="439" y="125" font-size="13">- estado : EstadoMaquina</text>
  <text x="439" y="160" font-size="12.5">+ encender()</text>
  <text x="439" y="182" font-size="12.5">+ ingresarFicha()</text>
  <text x="439" y="204" font-size="12.5">+ presionarInicio()</text>
  <text x="439" y="226" font-size="12.5">+ terminarJuego()</text>
  <text x="439" y="248" font-size="12.5">+ cambiarEstado(EstadoMaquina)</text>
  <text x="439" y="270" font-size="12.5">+ getEstado() : EstadoMaquina</text>

  <!-- ===== Aggregation MaquinaVideoJuego o--> EstadoMaquina ===== -->
  <polygon points="600,282 612,297 600,312 588,297" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="600" y1="312" x2="600" y2="340" stroke="#333" stroke-width="1.5"/>
  <text x="608" y="330" font-size="12" fill="#333" font-style="italic">-estado</text>

  <!-- ===== Abstract State: EstadoMaquina ===== -->
  <rect x="427" y="340" width="346" height="130" fill="#fff7e0" stroke="#e8a200" stroke-width="2"/>
  <line x1="427" y1="398" x2="773" y2="398" stroke="#e8a200" stroke-width="1.5"/>
  <text x="600" y="362" text-anchor="middle" font-size="12" font-style="italic" fill="#555">«abstract»</text>
  <text x="600" y="384" text-anchor="middle" font-size="15" font-weight="bold">EstadoMaquina</text>
  <text x="439" y="416" font-size="11">+ encender(MaquinaVideoJuego)</text>
  <text x="439" y="434" font-size="11">+ ingresarFicha(MaquinaVideoJuego)</text>
  <text x="439" y="452" font-size="11">+ presionarInicio(MaquinaVideoJuego)</text>
  <text x="439" y="468" font-size="11" font-style="italic" fill="#777">(por defecto no hacen nada; cada estado redefine lo suyo)</text>

  <!-- ===== Herencia tree (linea llena + triangulo hueco) ===== -->
  <polygon points="600,470 590,488 610,488" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="600" y1="488" x2="600" y2="512" stroke="#333" stroke-width="1.5"/>
  <line x1="127" y1="512" x2="1067" y2="512" stroke="#333" stroke-width="1.5"/>
  <line x1="127" y1="512" x2="127" y2="560" stroke="#333" stroke-width="1.5"/>
  <line x1="362" y1="512" x2="362" y2="560" stroke="#333" stroke-width="1.5"/>
  <line x1="600" y1="512" x2="600" y2="560" stroke="#333" stroke-width="1.5"/>
  <line x1="832" y1="512" x2="832" y2="560" stroke="#333" stroke-width="1.5"/>
  <line x1="1067" y1="512" x2="1067" y2="560" stroke="#333" stroke-width="1.5"/>

  <!-- ===== ConcreteStates ===== -->
  <rect x="20" y="560" width="214" height="50" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="127" y="590" text-anchor="middle" font-size="14" font-weight="bold">Apagada</text>
  <text x="127" y="628" text-anchor="middle" font-size="10" font-style="italic" fill="#666">encender → SinFichas</text>

  <rect x="255" y="560" width="214" height="50" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="362" y="590" text-anchor="middle" font-size="14" font-weight="bold">SinFichas</text>
  <text x="362" y="628" text-anchor="middle" font-size="10" font-style="italic" fill="#666">ficha → UnaFicha · inicio → cartel</text>

  <rect x="490" y="560" width="214" height="50" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="597" y="590" text-anchor="middle" font-size="14" font-weight="bold">UnaFicha</text>
  <text x="597" y="628" text-anchor="middle" font-size="10" font-style="italic" fill="#666">ficha → DosFichas · inicio → Jugando(1)</text>

  <rect x="725" y="560" width="214" height="50" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="832" y="590" text-anchor="middle" font-size="14" font-weight="bold">DosFichas</text>
  <text x="832" y="628" text-anchor="middle" font-size="10" font-style="italic" fill="#666">inicio → Jugando(2)</text>

  <rect x="960" y="560" width="214" height="50" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="1067" y="590" text-anchor="middle" font-size="14" font-weight="bold">Jugando</text>
  <text x="1067" y="628" text-anchor="middle" font-size="10" font-style="italic" fill="#666">terminarJuego → SinFichas</text>
</svg>
